plugins {
    id 'com.android.application'
}

android {
    namespace 'com.desembarcgames.plusultralife'
    compileSdk 34

    defaultConfig {
        applicationId "com.desembarcgames.plusultralife"
        minSdk 26
        targetSdk 34
        versionCode 11
        versionName "11.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
